# YAML contract


delimiter: ","
encoding: utf-8-sig

columns:
  invoice_id:
    type: str
    nullable: false
    unique: true
    rules: {}
    transformations: [upper]


  customer_name:
    type: str
    nullable: false
    unique: true
    rules: {}
    transformations: [strip, collapse_spaces, remove_accents, title]


  email:
    type: email
    nullable: true
    unique: false
    rules: {}
    transformations: [strip, lower]


  quantity:
    type: int
    nullable: true
    unique: false
    rules: {}
    transformations: []


  amount:
    type: decimal
    nullable: true
    unique: false
    rules: {min: 1, max: 2500}
    transformations: [format_decimal]


  invoice_date:
    type: date
    date_format: "DD-MM-YYYY"
    nullable: true
    unique: false
    rules: {}
    transformations: [normalize_date]


  paid:
    type: bool
    nullable: true
    unique: false
    rules: {}
    transformations: []


  status:
    type: str
    nullable: true
    unique: false
    rules: {}
    transformations: [strip, lower]


