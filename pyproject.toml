[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "csv-refine"
version = "0.1.3"
description = "A Python CLI for cleaning, filtering, and normalizing CSV files using configurable YAML data contracts."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "PyYAML>=6.0.3",
    "email-validator>=2.3.0"
]


[project.scripts]
csv-refine = "csv_refine.cli:run_csv_refine"


[project.urls]
Homepage = "https://github.com/alexiskuypers/csv-refine"
Repository = "https://github.com/alexiskuypers/csv-refine"
Issues = "https://github.com/alexiskuypers/csv-refine/issues"


[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
