[project]
name = "csv-refine"
version = "0.1.0"
dependencies = [
    "PyYAML>=6.0.3",
    "email-validator>=2.3.0"
]
requires-python = ">=3.12"

description = "A Python CLI for validating and normalizing CSV files using YAML data contracts."
readme = "README.md"


[project.urls]
Homepage = "https://github.com/alexiskuypers/csv-refine"
Repository = "https://github.com/alexiskuypers/csv-refine"
Issues = "https://github.com/alexiskuypers/csv-refine/issues"


[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
